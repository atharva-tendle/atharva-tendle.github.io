<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Pocket Coding Agent — training in progress</title>
<meta name="description" content="The Pocket Coding Agent — training in progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('pref-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
:root {
  --bg:#ffffff; --surface:#f6f7f8; --text:#1f2328; --muted:#5b626b; --faint:#8a929c;
  --border:#e4e7ea; --teal:#2f6f4e; --teal-soft:#2f6f4e16; --rust:#a8551f;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"] {
  --bg:#18191b; --surface:#202225; --text:#dce0e4; --muted:#9aa1a9; --faint:#6f767e;
  --border:#2c2f34; --teal:#6cae8e; --teal-soft:#6cae8e1c; --rust:#d98a5a;
}
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:1.0625rem; line-height:1.7; -webkit-font-smoothing:antialiased;
}
a { color:inherit; }
.site-header { border-bottom:1px solid var(--border); }
.nav {
  max-width:60rem; margin:0 auto; padding:1rem 1.25rem;
  display:flex; align-items:center; gap:1.25rem;
}
.nav__brand { font-weight:600; text-decoration:none; display:flex; align-items:center; gap:.5rem; }
.dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--teal); }
.nav__spacer { flex:1; }
.nav__links { display:flex; align-items:center; gap:1rem; font-size:.9375rem; color:var(--muted); }
.nav__links a { text-decoration:none; }
.nav__links a:hover { color:var(--teal); }
.theme-toggle {
  background:none; border:0; padding:.25rem; cursor:pointer; color:var(--muted);
  display:flex; align-items:center;
}
.theme-toggle svg { width:1.15rem; height:1.15rem; }
:root[data-theme="light"] .moon, :root[data-theme="dark"] .sun { display:none; }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.25rem; }
.card { width:100%; max-width:38rem; }
.eyebrow {
  font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--rust); margin:0 0 .75rem;
}
h1 { font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.2; margin:0 0 1.75rem; letter-spacing:-.02em; }
.console {
  background:var(--surface); border:1px solid var(--border); border-radius:.5rem;
  padding:1.15rem 1.25rem; font-family:var(--mono); font-size:.8125rem; line-height:1.9;
  color:var(--muted); overflow-x:auto;
}
.console .k { color:var(--teal); }
.bar {
  margin-top:.35rem; height:.5rem; border-radius:999px; background:var(--teal-soft);
  overflow:hidden;
}
.bar span {
  display:block; height:100%; width:40%; border-radius:999px; background:var(--teal);
  animation:crawl 4.5s ease-in-out infinite;
}
@keyframes crawl {
  0%   { width:12%; }
  50%  { width:71%; }
  100% { width:12%; }
}
.cursor { animation:blink 1.1s steps(2) infinite; color:var(--teal); }
@keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
@media (prefers-reduced-motion:reduce) {
  .bar span { animation:none; width:58%; }
  .cursor { animation:none; }
}
.back { margin-top:2rem; font-size:.9375rem; }
.back a { color:var(--teal); text-decoration:none; border-bottom:1px solid var(--teal-soft); }
.back a:hover { border-bottom-color:var(--teal); }
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav__brand" href="/"><span class="dot"></span> Atharva Tendle</a>
    <span class="nav__spacer"></span>
    <div class="nav__links">
      <a href="/projects/">Projects</a>
      <a href="/publications/">Publications</a>
      <a href="/about/">About</a>
      <button class="theme-toggle" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </nav>
</header>

<main>
  <div class="card">
    <p class="eyebrow">Training in progress</p>
    <h1>The Pocket Coding Agent</h1>

    <div class="console">
      <div><span class="k">$</span> python train.py --run pocket-agent-v2</div>
      <div>exploring and exploiting the environment <span class="cursor">▊</span></div>
      <div class="bar"><span></span></div>
    </div>

    <p class="back">In the meantime, there's more on <a href="/projects/">projects</a> and <a href="/about/">about</a>.</p>
  </div>
</main>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('pref-theme', next); } catch (e) {}
  });
})();
</script>

</body>
</html>
