baseURL: "https://atharva-tendle.github.io/"
languageCode: "en-us"
title: "Atharva Tendle"
theme: "PaperMod"

paginate: 10

params:
  defaultTheme: dark
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  showtoc: true

  homeInfoParams:
    Title: "Hi! I'm Atharva"
    Content: >
      Senior Research Engineer building intelligent AI systems that combine
      cutting-edge research with practical engineering. My focus is on developing
      Generative AI applications that are both powerful and reliable.
    imageUrl: "/assets/profile.JPG"
    imageTitle: "Atharva Tendle"
    imageWidth: 180
    imageHeight: 180

  socialIcons:
    - name: github
      url: "https://github.com/atharva-tendle"
    - name: linkedin
      url: "https://linkedin.com/in/atharva-tendle"
    - name: x
      url: "https://twitter.com/atharvatendle"
    - name: email
      url: "mailto:atendle13.3.98@gmail.com"
    - name: cv
      title: CV
      url: "/assets/Atharva_Tendle_CV.pdf"

  buttons:
    - name: Blog
      url: /blog/
    - name: Publications
      url: /publications/
    - name: About
      url: /about/

menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - "$$"
              - "$$"
          inline:
            - - "$"
              - "$"
        enable: true
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableRobotsTXT: true
